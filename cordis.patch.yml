# dsh-persona-innate bundle：M0 机制（先天画像 + events 记忆 + provenance + 指令剥离 + 每轮注入）+ M1 接线（self_model + 状态机 + 每日复盘 + 评测）
- insert:
    - id: persona-innate
      name: 'dsh-persona-innate'
      config:
        # 数据目录：不在此显式配置，未配置时由 src/paths.ts 自动定位固定绝对路径
        # dshHome/persona-innate（消除 cwd 相对路径漂移）；如需自定义可在用户 patch 层覆盖 dataDir。
        # 先天画像采样轮数（M0 默认 6 轮开放问题）
        sampleRounds: 6
        # 每轮注入最近记忆条数上限
        injectLimit: 5
        # P4 装配器切读开关：false = 走旧注入路径 + 装配器只 shadow 观测（默认）
        # 切 true 的前置条件见 docs/issue-register.md ISS-006：shadow 跑够 ≥14 天或 ≥30 轮、
        # 且注入差异指标达标。切读前不要改成 true——shadow 数据不足就切等于拿她的记忆做实验。
        useIntentAssembler: false
        # 指令性内容剥离：命中即拒绝写入并记录 stripped
        stripDirectives: true
        # M1：self_model 保留最近 N 版（回滚窗口）
        selfModelHistoryLimit: 10
        # M1：每日复盘开关 + 深夜静默执行时刻
        reviewEnabled: true
        reviewHour: 2
        # M1：假拒绝率上限 / 长程一致性采样轮
        honestyCeiling: 0.2
        auditRounds: [50, 200]
        # M1：LLM 模式（auto：有 ctx llm 用真实、无则 MockLlm；mock：强制 MockLlm）
        llmMode: 'auto'
